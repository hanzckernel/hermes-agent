<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HTML Change Card demo for Hermes Agent PR summaries</title>
  <desc id="desc">A deterministic change card showing how PR work can be summarized outside the pull request using HTML and SVG artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.65"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .tiny { font-size: 18px; fill: #94a3b8; }
      .small { font-size: 22px; fill: #cbd5e1; }
      .body { font-size: 24px; fill: #e2e8f0; }
      .heading { font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .title { font-size: 42px; font-weight: 800; fill: #f8fafc; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; fill: #67e8f9; }
      .muted { fill: #94a3b8; }
      .cyan { fill: #67e8f9; }
      .green { fill: #86efac; }
      .amber { fill: #fbbf24; }
      .rose { fill: #fb7185; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
  <circle cx="1080" cy="120" r="260" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="165" cy="620" r="220" fill="#22c55e" opacity="0.07"/>

  <g filter="url(#softShadow)">
    <rect x="54" y="44" width="1172" height="632" rx="30" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
  </g>

  <g transform="translate(92 82)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#083344" stroke="#155e75"/>
    <circle cx="22" cy="17" r="6" fill="#22d3ee"/>
    <text x="40" y="23" class="mono label">CHANGE CARD</text>

    <text x="0" y="88" class="sans title">HTML-generated PR summary artifact</text>
    <text x="0" y="126" class="sans small muted">A reviewable, deterministic visual that can live beside a PR without relying on image-model text rendering.</text>
  </g>

  <g transform="translate(92 250)">
    <rect x="0" y="0" width="340" height="258" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="26" y="44" class="sans heading">Problem</text>
    <text x="26" y="86" class="sans body">PRs explain code well,</text>
    <text x="26" y="118" class="sans body">but reviewers often need</text>
    <text x="26" y="150" class="sans body">a fast visual summary.</text>
    <line x1="26" y1="178" x2="310" y2="178" stroke="#334155"/>
    <text x="26" y="218" class="mono tiny muted">HTML file: source on GitHub</text>
    <text x="26" y="246" class="mono tiny muted">SVG file: renders directly</text>
  </g>

  <g transform="translate(470 250)">
    <rect x="0" y="0" width="340" height="258" rx="22" fill="#0f172a" stroke="#155e75"/>
    <text x="26" y="44" class="sans heading">Change</text>
    <circle cx="34" cy="87" r="8" fill="#22d3ee"/>
    <text x="56" y="96" class="sans body">Add a self-contained HTML card</text>
    <circle cx="34" cy="133" r="8" fill="#86efac"/>
    <text x="56" y="142" class="sans body">Export a matching SVG card</text>
    <circle cx="34" cy="179" r="8" fill="#fbbf24"/>
    <text x="56" y="188" class="sans body">Document GitHub rendering limits</text>
    <circle cx="34" cy="225" r="8" fill="#fb7185"/>
    <text x="56" y="234" class="sans body">Keep text exact and editable</text>
  </g>

  <g transform="translate(848 250)">
    <rect x="0" y="0" width="340" height="258" rx="22" fill="#0f172a" stroke="#166534"/>
    <text x="26" y="44" class="sans heading">Result</text>
    <text x="26" y="86" class="sans body">GitHub can show the SVG</text>
    <text x="26" y="118" class="sans body">in README/image preview.</text>
    <text x="26" y="160" class="sans body">The HTML can be opened</text>
    <text x="26" y="192" class="sans body">locally or via Pages.</text>
    <rect x="26" y="216" width="140" height="32" rx="16" fill="#052e16" stroke="#166534"/>
    <text x="45" y="238" class="mono tiny green">reviewable</text>
  </g>

  <g transform="translate(92 558)">
    <rect x="0" y="0" width="1096" height="78" rx="20" fill="#020617" stroke="#1e293b"/>
    <text x="28" y="48" class="mono small"><tspan class="cyan">Use:</tspan> commit HTML + SVG → embed SVG in README/PR body → enable GitHub Pages only when live HTML rendering is needed.</text>
  </g>
</svg>
